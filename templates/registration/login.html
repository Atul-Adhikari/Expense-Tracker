
{% extends 'base.html' %}

{% block title %}Login | ExpenseFlow{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">

        <div class="card p-4">

            <h3 class="text-center mb-2">Welcome Back</h3>
            <p class="text-muted text-center">
                Sign in to access your ExpenseFlow dashboard.
            </p>

            {% if form.errors %}
                <div class="alert alert-danger">
                    Invalid username or password.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-dark w-100">
                    Login
                </button>
            </form>

        </div>

    </div>
</div>

{% endblock %}
